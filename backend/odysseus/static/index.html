<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Alice</title>

  <!-- Alice — lean local-AI chat UI.
       Deliberately self-contained: ONE small CSS + two small classic <script>
       files (no ES-module graph, no circular imports) + the vendored
       highlight.min.js. This replaces the old odysseus fork whose deep
       type=module import graph + sync init busy-loop white-screened WebKit.
       Nothing here loads /static/js/* or /static/alice/* modules. -->

  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1024 1024'%3E%3Cg transform='translate(0,1024) scale(0.1,-0.1)' fill='%23F97316'%3E%3Cpath d='M5635 7050 c112 -184 252 -416 312 -515 60 -99 224 -369 365 -600 140 -231 373 -616 518 -855 144 -239 273 -452 286 -472 13 -20 193 -317 400 -660 207 -343 428 -707 490 -810 63 -103 114 -189 114 -192 0 -3 -525 -6 -1167 -6 l-1168 0 81 33 c91 37 197 109 262 177 261 272 330 674 181 1055 -43 110 -53 128 -315 550 -181 292 -334 542 -501 820 -201 336 -356 591 -367 602 -8 9 -29 -19 -87 -115 -95 -160 -269 -446 -431 -712 -69 -113 -168 -275 -220 -360 -52 -85 -141 -229 -198 -320 -277 -440 -323 -555 -336 -820 -7 -145 8 -250 57 -384 52 -145 181 -316 309 -412 47 -35 157 -90 197 -99 18 -3 35 -10 37 -13 4 -8 -2325 -5 -2332 3 -2 2 69 125 158 272 89 147 214 354 278 458 63 105 170 280 237 390 115 188 222 364 740 1220 117 193 276 456 355 585 170 280 516 850 833 1375 126 209 267 442 314 517 l85 138 155 -258 c86 -141 247 -408 358 -592z m-505 -1770 c0 -29 49 -159 83 -220 46 -84 123 -184 178 -234 109 -98 254 -173 384 -199 l70 -14 -73 -16 c-280 -63 -541 -316 -631 -612 -7 -22 -15 -47 -18 -55 -3 -8 -11 9 -19 38 -35 134 -126 286 -238 398 -119 118 -250 194 -401 231 l-66 16 88 22 c157 40 260 98 374 210 116 115 208 272 241 414 11 48 28 61 28 21z'/%3E%3C/g%3E%3C/svg%3E" />
  <link rel="manifest" href="/static/manifest.json" />
  <meta name="theme-color" content="#050505" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="format-detection" content="telephone=no, date=no, address=no, email=no" />

  <link rel="stylesheet" href="/static/lean/alice-chat.css" />

  <!-- Inline boot guard: paint the brand bg from the first byte so there is no
       white flash even before the stylesheet applies. Nonce'd for the strict
       CSP (the backend substitutes {{CSP_NONCE}}). This is the ONLY inline
       script and it does no work beyond setting a background color. -->
  <script nonce="{{CSP_NONCE}}">
    document.documentElement.style.background = '#050505';
  </script>
</head>
<body>
  <div id="app">
    <!-- First-run / setup screen (shown when no model is loaded). -->
    <section id="setup" aria-label="Set up Alice"></section>
    <!-- Chat screen (built by JS once a model is ready). -->
    <section id="chat" class="hidden" aria-label="Chat with Alice"></section>
  </div>

  <!-- Vendored syntax highlighter (optional; classic script, sets window.hljs).
       It has no dependents/imports of its own — single self-contained file. -->
  <script defer src="/static/lib/highlight.min.js"></script>
  <!-- Tiny markdown renderer (classic IIFE, sets window.AliceMD). -->
  <script defer src="/static/lean/alice-md.js"></script>
  <!-- Gateway honest-render helpers (classic IIFE, sets window.AliceGateway).
       Pure tier-status/receipt/login logic; must load before the controller. -->
  <script defer src="/static/lean/alice-gateway.js"></script>
  <!-- App controller (classic IIFE; talks to /alice/* + /v1/chat/completions). -->
  <script defer src="/static/lean/alice-lean.js"></script>
</body>
</html>
