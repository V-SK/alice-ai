# Alice AI — cross-OS UNSIGNED package build (M5/M6 + the 3-OS CI).
#
# Matrix: macos-14 (arm64) · windows-2022 (x64) · ubuntu-22.04 (x64). Each runner
# natively builds ITS package via the per-OS script (no cross-compile, PLAN §7):
#   * macOS   : packaging/macos/build_app.sh        → AliceAI.app + .dmg + .zip
#   * Windows : packaging/windows/build_exe.ps1     → one-dir zip (+ optional Inno)
#   * Linux   : packaging/linux/build_appimage.sh   → .AppImage
#
# The inference runtime swap (PLAN §6) is per-OS: macOS ships mlx (Apple Metal),
# Windows/Linux ship llama-cpp-python (GGUF, CPU wheel by default). The app code
# is OS-agnostic (the hardware probe picks the runtime family); CI just installs
# the per-OS dependency set and the spec bundles the matching native wheel.
#
# BUILD-ONLY — this workflow does NOT create a release, code-sign, notarize, or
# GPG-sign. Those are V-gated + offline (no certs in CI; UNSIGNED per V). The
# artifacts are uploaded for download/inspection; the ed25519 update manifest is
# the trust anchor later. A pip-audit step flags known-vulnerable deps.

name: release (unsigned build)

on:
  push:
    tags: ["v*"]            # tag-driven build (no auto release-create)
  workflow_dispatch:
    inputs:
      windows_cuda:
        description: "Windows: build the CUDA llama-cpp-python wheel"
        type: boolean
        default: false
      build_inno:
        description: "Windows: also build the Inno Setup installer"
        type: boolean
        default: false

# The Track-A inference engine (alice_acp) is VENDORED in-repo under
# backend/vendor/ (see NOTICE §2), so this build is SELF-CONTAINED — no external
# alice-acp checkout / PAT is needed.
env:
  PYTHON_VERSION: "3.12"
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            label: macOS-arm64
            req: backend/requirements.txt          # mlx lock (existing)
            artifact: alice-ai-macos-arm64
          - os: windows-2022
            label: Windows-x64
            req: backend/requirements.win.txt       # llama-cpp-python (swap)
            artifact: alice-ai-windows-x64
          - os: ubuntu-22.04
            label: Linux-x64
            req: backend/requirements.linux.txt     # llama-cpp-python (swap)
            artifact: alice-ai-linux-x64

    steps:
      # ----------------------------------------------------------------- #
      # Checkout — just this repo. alice_acp is vendored in-repo
      # (backend/vendor/), so there is NO sibling alice-acp checkout anymore.
      # ----------------------------------------------------------------- #
      - name: Checkout alice-ai
        uses: actions/checkout@v4
        with:
          path: alice-ai

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # ----------------------------------------------------------------- #
      # Linux: install the webkit2gtk/GTK BUILD-HOST libs so build_appimage.sh
      # can vendor them into the AppDir (the user box needs none). Also FUSE +
      # appimagetool prerequisites.
      # ----------------------------------------------------------------- #
      - name: Linux — webkit2gtk/GTK + AppImage prereqs
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # PyGObject<3.50 builds from source against gobject-introspection's
          # girepository-1.0 — provide its dev headers + the glib/cairo build deps
          # + g-ir tools so the meson build (`gi`/`cairo` deps) resolves on
          # ubuntu-22.04. webkit2gtk/GTK -dev + gir typelibs are vendored into the
          # AppDir by build_appimage.sh. FUSE + file/desktop-file-utils for
          # appimagetool.
          sudo apt-get install -y \
            libwebkit2gtk-4.1-0 libwebkit2gtk-4.1-dev \
            libgtk-3-0 gir1.2-gtk-3.0 gir1.2-webkit2-4.1 \
            libgirepository1.0-dev gobject-introspection \
            libglib2.0-dev libcairo2-dev pkg-config python3-dev \
            fuse libfuse2 file desktop-file-utils

      # ----------------------------------------------------------------- #
      # Dependencies — the per-OS set. macOS keeps its existing hash-pinned
      # lock; Win/Linux compile + install their lock from the per-OS input
      # (wheel hashes are per-platform — generated ON the runner, committed by
      # CI for reproducibility). The vendored alice_acp (backend/vendor/) is
      # installed --no-deps (its import-time deps SQLAlchemy + cryptography are in
      # the hashed set, so --no-deps keeps the hashed set authoritative).
      # ----------------------------------------------------------------- #
      - name: Install deps (macOS — existing hash-pinned lock)
        if: runner.os == 'macOS'
        working-directory: alice-ai
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r backend/requirements.lock.txt
          ( cd backend && python -m pip install --no-deps ./vendor )

      - name: Install deps (Windows — llama-cpp-python swap, compile+hash lock)
        if: runner.os == 'Windows'
        working-directory: alice-ai
        shell: pwsh
        run: |
          python -m pip install --upgrade pip uv
          if ($env:WINDOWS_CUDA -eq 'true') {
            $env:PIP_EXTRA_INDEX_URL = 'https://abetlen.github.io/llama-cpp-python/whl/cu124'
          }
          # cd backend FIRST so the input's `./vendor` path package resolves.
          cd backend
          python -m uv pip compile --generate-hashes --no-header `
            requirements.win.txt -o requirements.lock.win.txt
          # The vendored path package can't be hash-pinned (it's a local dir), so
          # uv emits it as an unhashed `./vendor` line — which --require-hashes
          # rejects. Strip that one line; we install the vendored package
          # separately --no-deps (its deps SQLAlchemy+cryptography ARE hashed).
          (Get-Content requirements.lock.win.txt) `
            | Where-Object { $_.Trim() -ne './vendor' } `
            | Set-Content requirements.lock.win.txt
          python -m pip install --no-deps .\vendor
          python -m pip install --require-hashes -r requirements.lock.win.txt
        env:
          WINDOWS_CUDA: ${{ github.event.inputs.windows_cuda }}

      - name: Install deps (Linux — llama-cpp-python swap, compile+hash lock)
        if: runner.os == 'Linux'
        working-directory: alice-ai
        run: |
          python -m pip install --upgrade pip uv
          # cd backend FIRST so the input's `./vendor` path package resolves.
          cd backend
          python -m uv pip compile --generate-hashes --no-header \
            requirements.linux.txt -o requirements.lock.linux.txt
          # The vendored path package can't be hash-pinned, so uv emits an
          # unhashed `./vendor` line that --require-hashes rejects. Strip it; we
          # install the vendored package separately --no-deps (its import-time
          # deps SQLAlchemy+cryptography ARE hashed in the lock).
          sed -i '/^\.\/vendor$/d' requirements.lock.linux.txt
          python -m pip install --no-deps ./vendor
          python -m pip install --require-hashes -r requirements.lock.linux.txt

      # ----------------------------------------------------------------- #
      # Build tooling — PyInstaller is the freezer the per-OS build scripts run.
      # It is a BUILD tool, not a runtime dep, so it is not in the hash-pinned
      # runtime locks; install it here (pinned) on every leg. Without it the
      # build step fails with "No module named PyInstaller".
      # ----------------------------------------------------------------- #
      - name: Install build tooling (PyInstaller)
        working-directory: alice-ai
        run: python -m pip install "pyinstaller==6.16.0"

      # ----------------------------------------------------------------- #
      # LINT / SECURITY PROBE — cross-OS checks. Import smoke + the unit-test
      # suite (model_manager, earn, simple-mode security) with the data-dir env
      # the odysseus DB needs. The macOS-only live security probe (needs a
      # resident MLX model) runs in the macOS leg of build_app.sh's smoke, not
      # here — these are the OS-portable gates.
      # ----------------------------------------------------------------- #
      - name: Import smoke + spec validation
        working-directory: alice-ai
        run: |
          python -c "import alice_acp.local_inference as li; print('alice_acp OK', li.__file__)"
          python -c "import webview; print('pywebview import OK')"
          python -c "import ast; ast.parse(open('backend/alice-backend.spec').read()); print('spec: valid Python')"
          python -c "import sys; sys.path.insert(0,'shell'); from alice_shell import supervisor, paths, win_job; print('shell modules import OK')"

      - name: Windows — Job Object self-check
        if: runner.os == 'Windows'
        working-directory: alice-ai
        run: python -c "import sys; sys.path.insert(0,'shell'); from alice_shell.win_job import self_check; raise SystemExit(self_check())"

      - name: Unit tests + invariant gates (with writable data dir for the DB)
        working-directory: alice-ai
        shell: bash
        run: |
          python -m pip install --quiet pytest
          export ALICE_AI_DATA_DIR="${RUNNER_TEMP}/alice-citest"
          mkdir -p "${ALICE_AI_DATA_DIR}"
          export DATABASE_URL="sqlite:///${ALICE_AI_DATA_DIR}/app.db"
          # tests/ includes the M8 cross-cutting invariant gates
          # (tests/test_invariants.py): privacy (no-network), honesty
          # (paid_acu=0 / Alice-only names / 待发放), security (Simple-mode
          # boundary). A regression in any of those FAILS this job.
          ( cd backend && PYTHONPATH="$(pwd)" python -m pytest tests/ -q )
          # Shell failure-mode gates (M8): port-conflict re-claim (F6) + bounded
          # backend restart on crash (F7). Cross-OS; the Windows Job-Object path
          # is self-checked in its own step above.
          PYTHONPATH=shell python -m pytest shell/tests/ -q

      # ----------------------------------------------------------------- #
      # LIVE security probe (macOS only) — the deep-security-audit's 28 exploit
      # checks against a running ephemeral instance + a real on-device MLX
      # generation. macOS-only because the probe drives a resident MLX model
      # (the OS-portable equivalents already ran as unit tests above). This is a
      # HARD GATE: any CRIT/HIGH regression (host check, anti-pivot token, forced
      # chat mode, router 404s, CSP 'self', honest privacy block) fails the build.
      # ----------------------------------------------------------------- #
      - name: Live security probe (28 checks + real inference)
        if: runner.os == 'macOS'
        working-directory: alice-ai
        shell: bash
        run: |
          # Pre-fetch the small probe MLX model so the run is deterministic.
          python - <<'PY'
          from huggingface_hub import snapshot_download
          snapshot_download("mlx-community/Qwen3-0.6B-4bit")
          PY
          # Boot on an ephemeral port with the real Simple-mode env, then probe.
          OUT="$(bash scripts/run_probe_backend.sh)"
          echo "$OUT"
          PORT="$(echo "$OUT" | sed -n 's/^PORT=//p')"
          TOKEN="$(echo "$OUT" | sed -n 's/^TOKEN=//p')"
          PID="$(echo "$OUT" | sed -n 's/^PID=//p')"
          trap 'kill "$PID" 2>/dev/null || true' EXIT
          python scripts/security_probe.py "$PORT" "$TOKEN"

      # ----------------------------------------------------------------- #
      # pip-audit — flag known-vulnerable installed deps (non-blocking advisory:
      # the build still produces an artifact, but the report is visible).
      # ----------------------------------------------------------------- #
      - name: pip-audit (advisory)
        working-directory: alice-ai
        shell: bash
        continue-on-error: true
        run: |
          python -m pip install --quiet pip-audit
          python -m pip_audit --strict --desc || echo "::warning::pip-audit reported findings (advisory)"

      # ----------------------------------------------------------------- #
      # BUILD the per-OS package via its script (UNSIGNED).
      # ----------------------------------------------------------------- #
      - name: Build — macOS .app + .dmg (ad-hoc signed, no Apple cert)
        if: runner.os == 'macOS'
        working-directory: alice-ai
        env:
          SKIP_FREEZE: "0"
        run: bash packaging/macos/build_app.sh

      - name: Build — Windows one-dir zip (+ optional Inno)
        if: runner.os == 'Windows'
        working-directory: alice-ai
        shell: pwsh
        run: |
          $extra = @()
          if ($env:WINDOWS_CUDA -eq 'true') { $extra += '-Cuda' }
          if ($env:BUILD_INNO -eq 'true')   { $extra += '-Inno' }
          # Deps already installed above -> -SkipDeps (still freezes + packs).
          pwsh packaging/windows/build_exe.ps1 -SkipDeps @extra
        env:
          WINDOWS_CUDA: ${{ github.event.inputs.windows_cuda }}
          BUILD_INNO: ${{ github.event.inputs.build_inno }}

      - name: Build — Linux AppImage (webkit2gtk vendored)
        if: runner.os == 'Linux'
        working-directory: alice-ai
        run: bash packaging/linux/build_appimage.sh

      # ----------------------------------------------------------------- #
      # Upload the UNSIGNED artifact(s). No release-create (V-gated).
      # ----------------------------------------------------------------- #
      - name: Upload ${{ matrix.artifact }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 14
          path: |
            alice-ai/dist/*.dmg
            alice-ai/dist/*.zip
            alice-ai/dist/*.AppImage
            alice-ai/dist/*-setup.exe

      # The generated per-OS hash-pinned lock (Win/Linux) — committed by V from
      # the CI run for reproducible, hash-enforced release builds.
      - name: Upload generated lock (Windows/Linux)
        if: runner.os != 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}-lock
          if-no-files-found: ignore
          path: |
            alice-ai/backend/requirements.lock.win.txt
            alice-ai/backend/requirements.lock.linux.txt
